name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          rustup show 2>&1 | tee toolchain.log
          rustup component add rustfmt clippy 2>&1 | tee -a toolchain.log || true
          cargo --version | tee -a toolchain.log
          rustc --version | tee -a toolchain.log
          rustfmt --version | tee -a toolchain.log

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Format (workspace)
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --version 2>&1 | tee format-workspace.log
          cargo fmt --all -- --check 2>&1 | tee -a format-workspace.log

      - name: Format (xtask)
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path xtask/Cargo.toml -- --check 2>&1 | tee format-xtask.log

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings 2>&1 | tee -a clippy.log

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-features 2>&1 | tee test.log

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --workspace 2>&1 | tee build.log

      - name: Build offline from the warm cache
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --workspace --offline 2>&1 | tee offline.log

      - name: Version
        shell: bash
        run: |
          set -euo pipefail
          version=$(./target/release/morid${{ runner.os == 'Windows' && '.exe' || '' }} --version)
          echo "morid --version -> $version"
          test "$version" = "morid 0.1.0"

      - name: Size report
        shell: bash
        run: |
          set -euo pipefail
          cargo run --offline --quiet --manifest-path xtask/Cargo.toml -- size | tee size-report.txt
          {
            echo '### Size report (${{ matrix.os }}, release)'
            echo '```'
            cat size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Licences, sources and bans
        shell: bash
        run: |
          set -euo pipefail
          cargo deny check 2>&1 | tee deny.log

      - name: Advisories
        shell: bash
        run: |
          set -euo pipefail
          cargo audit 2>&1 | tee audit.log

      - name: Print the lock file so it can be committed
        if: always()
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            echo '::group::Cargo.lock'
            cat Cargo.lock
            echo '::endgroup::'
          else
            echo "no Cargo.lock in the checkout"
          fi

      - name: Upload the lock file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-${{ matrix.os }}
          path: Cargo.lock
          if-no-files-found: ignore

      - name: Annotate the failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for log in *.log; do
            message=$(tail -n 25 "$log" | tr '\n' ' ' | cut -c1-900)
            echo "::error title=${log}::${message}"
          done
