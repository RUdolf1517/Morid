name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A cold Slint release build on macOS exceeded 15 minutes in run
    # 42906809411 after lint/tests passed. Keep a bound without truncating it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (ARM64) could not acquire a hosted runner in run
        # 42879040127. Keep macOS 26 coverage on the available x64 pool;
        # aarch64 command selection is still covered by the resolver tests.
        os: [ubuntu-latest, macos-26-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          rustup show 2>&1 | tee toolchain.log
          rustup component add rustfmt clippy 2>&1 | tee -a toolchain.log || true
          cargo --version | tee -a toolchain.log
          rustc --version | tee -a toolchain.log

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          # rustfmt directly, not `cargo fmt`: on the pinned toolchain the wrapper
          # prints its own usage text and exits 1 for both documented spellings
          # (testing.md §7). `git ls-files` decides which files are ours.
          rustfmt --version | tee format.log
          if ! git ls-files -z '*.rs' | xargs -0 rustfmt --edition 2021 --check 2>&1 | tee -a format.log; then
            # Keep the actual diff available through check annotations as well
            # as logs (log storage may be unreachable from a restricted client).
            python3 - <<'PYCODE'
          from pathlib import Path
          text = Path("format.log").read_text()
          for index, start in enumerate(range(0, len(text), 3500)):
              block = text[start:start + 3500]
              escaped = block.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=rustfmt chunk {index}::" + escaped)
          PYCODE
            exit 1
          fi

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings 2>&1 | tee -a clippy.log

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace --all-features 2>&1 | tee test.log
          # These are ordinary integration tests, not exclusive to the optional
          # verbose acceptance step. Removing that step must not remove coverage.
          python3 - <<'PYCODE'
          from pathlib import Path
          text = Path("test.log").read_text()
          for name in ["cancel_path_leaves_no_live_descendants", "naive_leader_kill_control_leaves_grandchild_alive", "service_cancelled_event_is_followed_by_empty_process_table"]:
              assert f"test {name} ... ok" in text, f"default Test omitted {name}"
          for name in ["live_interleaving_obeys_acknowledged_write_order", "live_both_pipes_larger_than_os_buffers_are_drained_without_loss", "both_progress_shapes_are_classified", "progress_txt_cr_separators_produce_five_ordered_progress_events"]:
              assert f"{name} ... ok" in text, f"default Test omitted {name}"
          for name in ["queue_limit_two_completes_all_five_jobs_without_stalling", "queue_fifo_three_jobs_refills_freed_slot_automatically", "queue_terminal_is_last_after_both_pipe_eof_fragments", "queue_cancel_before_admission_has_no_start_pid_or_destination", "queue_flood_does_not_starve_quiet_job_and_idle_poll_reports_waiting"]:
              assert f"{name} ... ok" in text, f"default Test omitted {name}"
          for name in ["lifecycle_admission_failures_are_typed_and_do_not_block_next_job", "lifecycle_nonzero_exit_preserves_tails_cwd_progress_and_typed_status", "lifecycle_cancel_all_observes_running_trees_and_never_starts_queued_job", "transport_command_reply_event_stream_and_clean_shutdown", "transport_cancel_all_reaches_worker_and_publishes_no_live_descendants"]:
              assert f"{name} ... ok" in text, f"default Test omitted {name}"
          for scenario in ["s01", "s02", "s03", "s04", "s05", "s09", "s10", "s11", "s12", "s17", "s19", "s20", "s21", "s22", "s37"]:
              name = f"dry_run_argv_matches_golden_{scenario}"
              assert f"{name} ... ok" in text, f"default Test omitted {name}"
          assert "captured_format_projection_preserves_backend_fields_and_adds_id ... ok" in text, "default Test omitted MediaMeta capture projection"
          PYCODE
          cargo test -p morid-ext thin_files_resolve_by_file_name -- --nocapture --test-threads=1 2>&1 | tee variants.log
          cargo test -p morid-cli warning_demo_copy_of_ytdl_patched -- --nocapture --test-threads=1 2>&1 | tee warnings-demo.log

      - name: Contained cancellation acceptance (process table)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p morid-engine --test cancel_tree -- --nocapture 2>&1 | tee cancel-tree.log
          python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path("cancel-tree.log").read_text().splitlines()
          proof = "\n".join(line for line in lines if "process table:" in line or "CANCEL_TREE_OK" in line or "NAIVE_KILL_CONTROL_OK" in line)
          print("::notice title=contained cancellation process tables::" + proof.replace("%", "%25").replace("\n", "%0A"))
          PYCODE

      - name: Service cancellation event acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p morid --test service_cancel -- --nocapture 2>&1 | tee service-cancel.log
          python3 - <<'PYCODE'
          from pathlib import Path
          proof = "\n".join(line for line in Path("service-cancel.log").read_text().splitlines() if "process table:" in line or "SERVICE_CANCELLED_OK" in line)
          print("::notice title=service cancellation process tables::" + proof.replace("%", "%25").replace("\n", "%0A"))
          PYCODE

      - name: Live pipe interleaving and both progress shapes
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p morid-engine --test live_stream -- --nocapture 2>&1 | tee live-stream.log
          cargo test --locked -p morid-engine both_progress_shapes_are_classified -- --nocapture 2>&1 | tee progress-shapes.log

      - name: Phase 3 fifteen CLI dry-run golden vectors
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p morid-cli --test planning dry_run_argv_matches_golden -- --nocapture 2>&1 | tee phase3-goldens.log

      - name: Windows preassignment escape property (not criterion 5)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p morid-engine --test windows_assignment_race assign_after_spawn_leaves_preassignment_grandchild_alive -- --nocapture 2>&1 | tee windows-race.log

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --workspace 2>&1 | tee build.log

      - name: Install executable-adjacent extensions for release smoke
        shell: bash
        run: cp -R extensions target/release/extensions

      - name: Phase 3 offline CLI acceptance outside checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_cli_phase3.py target/release/morid${{ runner.os == 'Windows' && '.exe' || '' }} 2>&1 | tee phase3-cli.log
          python3 - <<'PYCODE'
          from pathlib import Path
          prefixes = ("CAPTURED LIST INPUT", "CAPTURED FORMATS", "TABLE EXPECTED", "LANGUAGE REJECTION", "ENGINE VERSION unknown", "CANCELLED BATCH JSONL")
          for line in Path("phase3-cli.log").read_text().splitlines():
              if line.startswith(prefixes):
                  print("::notice title=Phase 3 review follow-up::" + line.replace("%", "%25"))
          PYCODE

      - name: Phase 4 offline user-data CLI checks
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/test_cli_phase4.py target/release/morid${{ runner.os == 'Windows' && '.exe' || '' }} 2>&1 | tee phase4-cli.log; then
            python3 - <<'PYCODE'
          from pathlib import Path
          text = Path("phase4-cli.log").read_text(encoding="utf-8", errors="replace")
          start = text.find("FAIL:")
          if start < 0:
              start = text.find("ERROR:")
          text = text[start:] if start >= 0 else text[-14000:]
          for index, start in enumerate(range(0, min(len(text), 16000), 3500)):
              block = text[start:start + 3500]
              print(f"::error title=Phase 4 CLI failure {index}::" + block.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYCODE
            exit 1
          fi

      - name: Phase 4 live original readback (Linux, network isolated)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config qtbase5-dev
          # The captured/anonymized download-folder value must name a real
          # directory, otherwise the original correctly resets it on startup.
          sudo install -d -o "$USER" -g "$(id -gn)" /home/user
          cmake -S legacy -B target/phase4-legacy -DBUILD_WITH_QT6=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build target/phase4-legacy --parallel 2
          g++ -std=c++14 -fPIC -shared tools/phase4_original_probe.cpp -o target/phase4-original-probe.so $(pkg-config --cflags --libs Qt5Widgets Qt5Core) -ldl
          if ! python3 tools/test_phase4_original.py target/release/morid target/phase4-legacy/media-downloader target/phase4-original-probe.so 2>&1 | tee phase4-original.log; then
            python3 - <<'PYCODE'
          from pathlib import Path
          text = Path("phase4-original.log").read_text(encoding="utf-8", errors="replace")[-16000:]
          for index, start in enumerate(range(0, len(text), 3500)):
              block = text[start:start + 3500]
              print(f"::error title=Phase 4 original readback {index}::" + block.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYCODE
            exit 1
          fi
          python3 - <<'PYCODE'
          from pathlib import Path
          for line in Path("phase4-original.log").read_text(encoding="utf-8", errors="replace").splitlines():
              if line.startswith(("ORIGINAL_", "EXPORTED FILE LIST")):
                  print("::notice title=Live original readback::" + line.replace("%", "%25"))
          PYCODE

      # Deliberately separate from offline tests: installs a real backend, then
      # downloads only from an ephemeral loopback server, outside the checkout.
      - name: Phase 3 real yt-dlp HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/morid-ytdlp"
          if [ "${{ runner.os }}" = Windows ]; then
            py="$RUNNER_TEMP/morid-ytdlp/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/morid-ytdlp/bin/python"
          fi
          "$py" -m pip install yt-dlp
          "$py" tools/phase3_http_smoke.py target/release/morid${{ runner.os == 'Windows' && '.exe' || '' }} 2>&1 | tee phase3-http.log
          python3 - <<'PYCODE'
          from pathlib import Path
          for line in Path("phase3-http.log").read_text().splitlines():
              if line.startswith(("JSONL FIRST", "JSONL LAST", "JSONL WC-L", "REAL HTTP FILE")):
                  print("::notice title=real HTTP evidence::" + line.replace("%", "%25"))
          PYCODE

      - name: Resolve all bundled engines without starting them
        shell: bash
        run: |
          set -euo pipefail
          status=0
          ./target/release/morid engines > engines.txt 2> engines-warnings.txt || status=$?
          test "$status" = 0 || test "$status" = 4
          cat engines.txt
          cat engines-warnings.txt
          status=0
          ./target/release/morid engines --json > engines.jsonl 2> engines-json-warnings.txt || status=$?
          test "$status" = 0 || test "$status" = 4
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          rows = Path("engines.jsonl").read_text().splitlines()
          assert len(rows) == 17, len(rows)
          assert all(isinstance(record := json.loads(row), dict) and record["resolved"] for row in rows)
          print(rows[0])
          print(rows[-1])
          print("JSONL lines:", len(rows))
          PYCODE
          {
            echo '### Engine resolution (${{ matrix.os }})'
            echo '```text'
            cat engines.txt engines-warnings.txt
            echo '```'
            echo '```jsonl'
            head -n 1 engines.jsonl
            tail -n 1 engines.jsonl
            echo '```'
            echo "JSONL lines: $(wc -l < engines.jsonl)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build offline from the warm cache
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --workspace --offline 2>&1 | tee offline.log

      - name: Version
        shell: bash
        run: |
          set -euo pipefail
          version=$(./target/release/morid${{ runner.os == 'Windows' && '.exe' || '' }} --version)
          echo "morid --version -> $version"
          test "$version" = "morid 0.1.0"

      - name: Console binary does not link Slint
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p morid-cli | tee tree-cli.log
          if cargo tree -p morid-cli -i slint > /dev/null 2>&1; then
            echo "morid-cli depends on slint" >&2
            exit 1
          fi
          if cargo tree -p morid-cli -i morid-gui > /dev/null 2>&1; then
            echo "morid-cli depends on morid-gui" >&2
            exit 1
          fi
          echo "morid-cli depends on neither slint nor morid-gui"

      - name: GUI smoke (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils imagemagick libgl1-mesa-dri mesa-utils
          # The screenshot is taken from inside the X server's own environment,
          # otherwise DISPLAY belongs to the outer shell and the capture fails.
          xvfb-run -a --server-args="-screen 0 1024x768x24" bash -eu -c '
            export MORID_GUI_SMOKE_MS=9000
            export LIBGL_ALWAYS_SOFTWARE=1
            ./target/release/morid-gui &
            gui=$!
            sleep 5
            import -window root gui-linux.png || echo "import failed"
            ls -l gui-linux.png || true
            wait "$gui"
          '
          echo "morid-gui exited 0 after opening its window"

      - name: GUI smoke (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          MORID_GUI_SMOKE_MS=8000 ./target/release/morid-gui &
          gui=$!
          sleep 5
          screencapture -x gui-macos.png || echo "screenshot unavailable"
          ls -l gui-macos.png || true
          wait "$gui"
          echo "morid-gui exited 0 after opening its window"

      - name: GUI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MORID_GUI_SMOKE_MS = "4000"
          $process = Start-Process -FilePath ".\target\release\morid-gui.exe" -PassThru `
            -RedirectStandardOutput gui-stdout.txt -RedirectStandardError gui-stderr.txt
          $exited = $process.WaitForExit(60000)
          if (-not $exited) {
            $process.Kill()
            "did not exit within 60 s" | Tee-Object -FilePath gui-smoke.log
            exit 1
          }
          $stdout = Get-Content gui-stdout.txt -Raw -ErrorAction SilentlyContinue
          $stderr = Get-Content gui-stderr.txt -Raw -ErrorAction SilentlyContinue
          "exit code $($process.ExitCode); stdout: $stdout; stderr: $stderr" | Tee-Object -FilePath gui-smoke.log
          if ($process.ExitCode -eq 0) { exit 0 }
          # The hosted Windows runner has no OpenGL driver, so the femtovg renderer
          # cannot start. That is a property of the runner, not of the binary: the
          # same binary opens a window on Linux and macOS in this workflow. Any
          # other exit is a real failure.
          if ($stderr -match "Failed to initialize OpenGL driver") {
            Write-Output "::warning title=gui-windows::the runner has no OpenGL driver, so the window cannot be shown here: $($stderr.Trim())"
            exit 0
          }
          exit 1

      - name: Upload the window screenshot
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gui-window-${{ matrix.os }}
          path: |
            gui-linux.png
            gui-macos.png
          if-no-files-found: ignore

      - name: Size report
        shell: bash
        run: |
          set -euo pipefail
          cargo run --offline --quiet --manifest-path xtask/Cargo.toml -- size | tee size-report.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          text = Path("size-report.txt").read_text().replace("%", "%25").replace("\n", "%0A")
          print("::notice title=release binary sizes::" + text)
          PYCODE
          {
            echo '### Size report (${{ matrix.os }}, release)'
            echo '```'
            cat size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Phase 0 checks (one platform)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_unsafe_scope.py
          python3 -m unittest -v tools.test_unsafe_scope
          python3 -m unittest tools.capture.test_qt_ini_roundtrip 2>&1 | tee phase0-unittest.log
          ran=$(grep -o 'Ran [0-9]* test' phase0-unittest.log | grep -o '[0-9]*')
          echo "unittest reported ${ran} tests"
          # The task says 16; the suite has 30. Asserting the number is the point:
          # a discovery bug reports 0 tests and exits 0.
          test "${ran}" = "30"
          python3 tools/capture/verify_fixtures.py 2>&1 | tee phase0-verify.log
          grep -q '^VERIFY_OK$' phase0-verify.log

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Licences, sources and bans
        shell: bash
        run: |
          set -euo pipefail
          cargo deny check 2>&1 | tee deny.log

      - name: Advisories
        shell: bash
        run: |
          set -euo pipefail
          cargo audit 2>&1 | tee audit.log

      - name: Verify crate boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import subprocess
          checks = [
              ["grep", "-rn", "--exclude-dir=morid-engine", "std::process", "crates/"],
              ["grep", "-rn", r"std::fs\|std::net\|SystemTime\|rand", "crates/morid-core/"],
          ]
          for command in checks:
              result = subprocess.run(command, text=True, capture_output=True)
              print("$", " ".join(command))
              print(result.stdout, end="")
              print("exit code:", result.returncode)
              assert result.returncode == 1, result.stderr or result.stdout
          PYCODE

      - name: Phase 2 evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          def emit(title, text):
              # GitHub truncates individual annotation messages at 4096 bytes.
              # Keep the diagnostic tail, including the error, retrievable via API.
              for index, start in enumerate(range(0, len(text), 3000)):
                  block = text[start:start + 3000]
                  block = block.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::notice title={title} chunk {index}::{block}")
          for name in ["phase3-cli.log", "phase3-http.log", "phase3-goldens.log", "engines.txt", "engines-warnings.txt", "size-report.txt", "phase0-unittest.log", "phase0-verify.log", "variants.log", "warnings-demo.log", "windows-race.log", "cancel-tree.log", "service-cancel.log", "live-stream.log", "progress-shapes.log", "test.log"]:
              path = Path(name)
              if path.exists(): emit(name, path.read_text(errors="replace")[-12000:])
          path = Path("test.log")
          if path.exists(): emit("named-tests", "\n".join(line for line in path.read_text(errors="replace").splitlines() if line.startswith("test ") or "rule " in line or "warning-demo" in line or ": warning:" in line))
          path = Path("engines.jsonl")
          if path.exists():
              rows = path.read_text().splitlines()
              emit("jsonl", f"lines={len(rows)}\n{rows[0]}\n{rows[-1]}" if rows else "empty")
          for name in ["clippy.log", "build.log"]:
              path = Path(name)
              if path.exists() and "error" in (text := path.read_text(errors="replace")): emit(name, text[-5000:])
          PYCODE

      - name: Upload Phase 2 verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-evidence-${{ matrix.os }}
          path: |
            test.log
            phase3-cli.log
            phase4-cli.log
            phase4-original.log
            phase3-http.log
            phase3-goldens.log
            variants.log
            warnings-demo.log
            windows-race.log
            cancel-tree.log
            service-cancel.log
            live-stream.log
            progress-shapes.log
            engines.txt
            engines.jsonl
            engines-warnings.txt
            size-report.txt
            phase0-unittest.log
            phase0-verify.log
            clippy.log
          if-no-files-found: error
