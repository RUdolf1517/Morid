name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show
          cargo --version
          rustc --version

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Format
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path xtask/Cargo.toml -- --check

      - name: Lint
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --workspace --all-features

      - name: Build release
        shell: bash
        run: cargo build --release --workspace

      - name: Build offline from the warm cache
        shell: bash
        run: cargo build --release --workspace --offline

      - name: Version
        shell: bash
        run: |
          set -euo pipefail
          version=$(./target/release/morid${{ runner.os == 'Windows' && '.exe' || '' }} --version)
          echo "$version"
          test "$version" = "morid 0.1.0"

      - name: Size report
        shell: bash
        run: |
          set -euo pipefail
          cargo run --offline --quiet --manifest-path xtask/Cargo.toml -- size | tee size-report.txt
          {
            echo '### Size report (`${{ matrix.os }}`, release)'
            echo '```'
            cat size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Licences, sources and bans
        shell: bash
        run: cargo deny check

      - name: Advisories
        shell: bash
        run: cargo audit

      - name: Print the lock file so it can be committed
        if: always()
        shell: bash
        run: |
          echo '::group::Cargo.lock'
          cat Cargo.lock
          echo '::endgroup::'
