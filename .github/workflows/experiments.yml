name: experiments

# Temporary workflow for two acceptance criteria that cannot be performed in the
# environment where Phase 1 was written (no Rust there at all):
#   criterion 10 — build with no C compiler;
#   and the evidence that nothing in the dependency graph compiles C.
# Deleted before the pull request is handed over.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-c-compiler:
    name: no C compiler (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          rustup show
          rustup component add rustfmt clippy || true
          cargo --version
          rustc --version

      - name: What is installed before removing anything
        shell: bash
        run: |
          {
            echo "cc=$(command -v cc || echo none)"
            echo "gcc=$(command -v gcc || echo none)"
            echo "clang=$(command -v clang || echo none)"
            echo "ld=$(command -v ld || echo none)"
          } | tee before.log
          gcc --version | head -1

      - name: Remove every C compiler
        shell: bash
        run: |
          sudo apt-get remove -y --purge 'gcc*' 'g++*' 'clang*' 'build-essential' 'cpp*' 'libgcc*' || true
          sudo rm -f /usr/bin/cc /usr/bin/gcc /usr/bin/g++ /usr/bin/c++ /usr/bin/clang /usr/bin/clang++ || true
          {
            echo "cc=$(command -v cc || echo none)"
            echo "gcc=$(command -v gcc || echo none)"
            echo "clang=$(command -v clang || echo none)"
            echo "crtbegin=$(ls /usr/lib/gcc/x86_64-linux-gnu/*/crtbegin.o 2>/dev/null | head -1 || echo none)"
          } | tee after.log
          dpkg -l | grep -E '^ii +(gcc|g\+\+|clang)' | head -5 || echo "no gcc or clang package installed"

      - name: Does anything in the graph compile C
        shell: bash
        run: |
          set +e
          cargo tree --workspace --prefix none --edges build > tree-build.log 2>&1
          echo "tree exit code: $?" | tee -a tree-build.log
          cargo tree --workspace -i cc > tree-cc.log 2>&1
          echo "tree -i cc exit code: $?" | tee -a tree-cc.log
          for crates in cc cc-1.2 gcc; do :; done
          head -n 12 tree-build.log
          head -n 5 tree-cc.log

      - name: Build the GNU target with no C compiler
        shell: bash
        run: |
          set +e
          cargo build --release --workspace > build-gnu.log 2>&1
          status=$?
          echo "GNU build exit code: $status" | tee -a build-gnu.log
          tail -n 12 build-gnu.log

      - name: Build the console binary for musl with rust-lld
        shell: bash
        run: |
          set +e
          rustup target add x86_64-unknown-linux-musl 2>&1 | tail -2
          RUSTFLAGS="-C linker=rust-lld -C link-self-contained=+linker" \
            cargo build --release -p morid-cli --target x86_64-unknown-linux-musl > build-musl.log 2>&1
          status=$?
          echo "musl build exit code: $status" | tee -a build-musl.log
          tail -n 12 build-musl.log
          if [ "$status" = "0" ]; then
            ls -l target/x86_64-unknown-linux-musl/release/morid | tee -a build-musl.log
            ./target/x86_64-unknown-linux-musl/release/morid --version | tee -a build-musl.log
          fi

      - name: Emit the results
        if: always()
        shell: bash
        run: |
          for log in after.log tree-build.log build-gnu.log build-musl.log; do
            if [ -f "$log" ]; then
              message=$(tail -n 12 "$log" | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-900)
              echo "::warning title=${log}::${message}"
            fi
          done
