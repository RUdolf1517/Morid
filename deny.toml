[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
]

[[licenses.exceptions]]
name = "slint"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[advisories]
# Missing from the specification (workspace-manifest.md §4). With no
# `[advisories]` section `cargo deny check` denies every advisory, unmaintained
# ones included, and Slint 1.13 carries one it cannot drop: RUSTSEC-2026-0372,
# `zvariant_derive` unmaintained, arriving as
# slint → i-slint-backend-winit → zbus 5. "No safe upgrade is available": the
# fix is zbus 6, which this Slint does not use. Named rather than blanket
# ignored so it is revisited when Slint moves; vulnerabilities still fail.
ignore = ["RUSTSEC-2026-0372"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
