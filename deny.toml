[licenses]
version = 2
confidence-threshold = 0.9
# The specification's nine identifiers, plus two that only appear in the
# transitive tree Slint brings (workspace-manifest.md §4 lists the direct
# dependencies, not their graph):
#   BSL-1.0      clipboard-win, via copypasta, via slint (deny.log: "license is
#                not explicitly allowed");
#   Unicode-3.0  the icu_* crates, via url, via slint;
#   GPL-2.0-or-later  Morid's own crates, whose licence the specification's own
#                allow list forgot (deny.log: morid 0.1.0 rejected).
# Both are permissive and GPL-compatible; the report says so explicitly.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "GPL-2.0-or-later",
]

# The exception has to name every Slint crate in the graph, not only `slint`:
# they all declare the same triple licence, and an exception is matched by crate
# name. `i-slint-*` are Slint's internal runtime crates, pulled in by `slint`.
[[licenses.exceptions]]
name = "slint"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "slint-macros"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-core"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-core-macros"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-common"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-compiler"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-backend-selector"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-backend-winit"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-renderer-femtovg"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-renderer-skia"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[advisories]
# Missing from the specification (workspace-manifest.md §4). With no
# `[advisories]` section `cargo deny check` denies every advisory, unmaintained
# ones included, and Slint 1.13 carries three it cannot drop:
#   RUSTSEC-2026-0370  zvariant          unmaintained
#   RUSTSEC-2026-0371  zbus_names        unmaintained
#   RUSTSEC-2026-0372  zvariant_derive   unmaintained
# all arriving as slint → i-slint-backend-winit → zbus 5. Every one says "No
# safe upgrade is available": the fix is zbus 6, which this Slint does not use.
# Named rather than blanket ignored so they are revisited when Slint moves;
# vulnerabilities still fail the check. The advisory database has no other
# entry for zbus, zbus_names, zbus_macros, zvariant, zvariant_derive or
# zvariant_utils (api.github.com/repos/rustsec/advisory-db/contents/crates/…).
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
