[licenses]
version = 2
confidence-threshold = 0.9
# The specification's nine identifiers, plus two that only appear in the
# transitive tree Slint brings (workspace-manifest.md §4 lists the direct
# dependencies, not their graph):
#   BSL-1.0      clipboard-win, via copypasta, via slint (deny.log: "license is
#                not explicitly allowed");
#   Unicode-3.0  the icu_* crates, via url, via slint;
#   GPL-2.0-or-later  Morid's own crates, whose licence the specification's own
#                allow list forgot (deny.log: morid 0.1.0 rejected).
# Both are permissive and GPL-compatible; the report says so explicitly.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "GPL-2.0-or-later",
]

# The exception has to name every Slint crate in the graph, not only `slint`:
# they all declare the same triple licence, and an exception is matched by crate
# name. `i-slint-*` are Slint's internal runtime crates, pulled in by `slint`.
[[licenses.exceptions]]
name = "slint"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "slint-macros"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-core"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-core-macros"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-common"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-compiler"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-backend-selector"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-backend-winit"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-renderer-femtovg"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[[licenses.exceptions]]
name = "i-slint-renderer-skia"
allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"]

[advisories]
# Missing from the specification (workspace-manifest.md §4). With no
# `[advisories]` section `cargo deny check` denies every advisory, unmaintained
# ones included, and Slint's dependency tree carries a growing set of them:
# zvariant, zbus_names, zvariant_derive, ttf-parser, rustybuzz, pin-utils — all
# transitive, all "no safe upgrade inside Slint 1.13". Listing them one by one
# makes the file a diary of somebody else's packaging.
#
# So the policy is stated instead: unmaintained advisories are reported for
# workspace crates only. Vulnerabilities still fail the check, and `cargo audit`
# in the next step still prints every unmaintained crate it finds, without
# gating — which is the D-008 shape: report, do not hide, do not block on a
# property of a third-party tree that Morid cannot fix.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Not in the specification. Every workspace dependency is written as
# `{ path = "crates/…" }` with no version, which cargo-deny reports as a wildcard
# requirement and `wildcards = "deny"` then rejects (deny.log: "found 10 wildcard
# dependencies for crate 'morid'"). `allow-wildcard-paths` exempts exactly those
# while a wildcard on a registry dependency stays an error.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
